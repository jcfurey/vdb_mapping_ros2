/**:
  ros__parameters:
    # Basic setup
    map_frame: map
    robot_frame: base_link
    map_directory_path: ""
    max_serialized_grid_bytes: 536870912
    max_section_voxels: 50000000

    # Visualizations
    publish_pointcloud: true
    publish_vis_marker: false
    visualization_rate: 5.0

    # Sensor input
    # The map server applies no raw sensor data; accumulation parameters are
    # therefore not declared in this configuration.
    apply_raw_sensor_data: false

    map_server:
      # Absolute path to a PCD file loaded into the map at startup.
      initial_map_file: ""
      set_background: false
      clear_map: true
