/**:
  ros__parameters:
    # Basic setup
    map_frame: map
    robot_frame: base_link
    max_range: 100.0
    resolution: 0.05
    prob_hit: 0.7
    prob_miss: 0.4
    # Activation thresholds (occupied above max, free below min). NOT the
    # OctoMap 0.12/0.97 pair — those are Eq. 4 CLAMPING bounds; used here
    # they cost ~5 accumulation windows before an obstacle appears at all.
    prob_thres_min: 0.49
    prob_thres_max: 0.51
    map_directory_path: ""
    fast_mode: true

    # Visualizations
    publish_pointcloud: true
    publish_vis_marker: true
    publish_occupancy_grid: true
    visualization_rate: 2.0

    # Sensor input
    accumulate_updates: true
    accumulation_period: 0.2

    apply_raw_sensor_data: true
    sources: [velodyne]
    velodyne:
      topic: scan_matched_points2
      sensor_origin_frame: velodyne
      reliable: true

    # Remote mapping
    publish_sections: true
    section_update:
      rate: 1.0
      min_coord:
        x: -10.0
        y: -10.0
        z: -10.0
      max_coord:
        x: 10.0
        y: 10.0
        z: 10.0


